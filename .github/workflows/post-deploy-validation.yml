name: Post-deploy production validation

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: post-deploy-production-validation
  cancel-in-progress: true

jobs:
  validate-production:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate the published website
        env:
          SITE_URL: https://www.rpovoadata.tech
        run: node scripts/validate-production.mjs

      - name: Submit public URLs to IndexNow
        env:
          SITE_URL: https://www.rpovoadata.tech
        run: node scripts/submit-indexnow.mjs
